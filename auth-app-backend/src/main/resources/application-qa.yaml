security:
  jwt:
    secret: ${JWT_SECRET}
    issuer: ${JWT_ISSUER:api.substring.com}
    access-ttl-seconds: ${JWT_ACCESS_TTL_SECONDS:900}
    refresh-ttl-seconds: ${JWT_REFRESH_TTL_SECONDS:1209600}
    refresh-token-cookie-name: ${JWT_REFRESH_COOKIE_NAME:refreshToken}
    cookie-secure: ${JWT_COOKIE_SECURE:true}
    cookie-http-only: ${JWT_COOKIE_HTTP_ONLY:true}
    cookie-same-site: ${JWT_COOKIE_SAME_SITE:none}
    cookie-domain: ${JWT_COOKIE_DOMAIN:}

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
  auth:
    frontend:
      success-redirect: ${APP_AUTH_FRONTEND_SUCCESS_REDIRECT:http://localhost:5173/oauth/success}
      failure-redirect: ${APP_AUTH_FRONTEND_FAILURE_REDIRECT:http://localhost:5173/oauth/failure}
